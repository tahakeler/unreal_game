# CCGS project configuration — single source of truth for project settings.
# See .claude/docs/effects-map.md for full schema.

schema_version: 1

framework:
  version: 1.1.3
  last_upgraded: 2026-09-25

# NOTE: this template ships with no `modes:` block, and the six knobs below must
# never be added to one.
#
# `/start` DOES add `modes.rigor` and `modes.automation` here — that is its job,
# and a `modes:` block containing those two is the expected state of a configured
# project, not a mistake.
#
# What must stay absent is the six knobs `modes.rigor` FRONTS:
# `modes.review_mode`, `modes.workflow`, `docs.density`, `qa.level`,
# `modes.story_granularity` and `team.size`. Seeding any of them in this file
# pins that value and shadows the rigor expansion, so `/start` asking "what are
# you building?" would stop changing anything. `/start` Phase 3c documents the
# same rule for the file it writes.
#
# Per-developer preferences belong in `project.local.yaml` (gitignored), not
# here. `/settings --local <key>=<value>` writes there; `/settings <key>=<value>`
# edits this file. See `.claude/docs/config-resolution.md` for the full
# precedence order.

# Written by /setup-engine (Unity 6.3 LTS 6000.3.26f1, HARVEST PANIC). The Unity
# project lives in a subfolder: HarvestPanic/ (Assets/, Packages/, ProjectSettings/).
# Networking: Netcode for GameObjects + Facepunch.Steamworks transport (UTP/LAN for dev).
engine:
  name: "Unity"
  version: "6000.3.26f1"
  language: "C#"
  rendering: "URP"
  physics: "PhysX"
  path: "/Applications/Unity/Hub/Editor/6000.3.26f1"

specialists:
  code: "unity-specialist"
  shader: "unity-shader-specialist"
  ui: "unity-ui-specialist"
  additional: ["unity-addressables-specialist", "unity-dots-specialist"]

naming:
  classes: PascalCase
  variables: camelCase
  constants: SCREAMING_SNAKE   # UNVERIFIED — not sourceable from
                               # docs/engine-reference/unity/; confirm before relying on it
  signals: On<Event>
  files: PascalCase
  scenes: PascalCase

commands:
  # Unity batchmode CLI. Run from the repo root; results/logs go to gitignored Logs/.
  # build: needs a static editor method HarvestPanic.Editor.BuildScript.BuildMac
  # (Assets/Scripts/Editor/BuildScript.cs) — create it before relying on this.
  # Windows target: -executeMethod HarvestPanic.Editor.BuildScript.BuildWindows64
  # PlayMode suite: same as `test` with -testPlatform PlayMode and
  #   -testResults "$(pwd)/Logs/playmode-results.xml" -logFile Logs/playmode.log
  build: '"/Applications/Unity/Hub/Editor/6000.3.26f1/Unity.app/Contents/MacOS/Unity" -batchmode -nographics -quit -projectPath HarvestPanic -executeMethod HarvestPanic.Editor.BuildScript.BuildMac -logFile Logs/build.log'
  test: '"/Applications/Unity/Hub/Editor/6000.3.26f1/Unity.app/Contents/MacOS/Unity" -batchmode -nographics -projectPath HarvestPanic -runTests -testPlatform EditMode -testResults "$(pwd)/Logs/editmode-results.xml" -logFile Logs/editmode.log'
  run: 'open "HarvestPanic/Builds/Mac/HarvestPanic.app"'
  smoke: '"/Applications/Unity/Hub/Editor/6000.3.26f1/Unity.app/Contents/MacOS/Unity" -batchmode -nographics -quit -projectPath HarvestPanic -logFile Logs/smoke.log'
