# CCGS project configuration — single source of truth for project settings.
# See .claude/docs/effects-map.md for full schema.

schema_version: 1

framework:
  version: 1.1.3
  last_upgraded: 2026-09-25

# NOTE: this template ships with no `modes:` block, and the six knobs below must
# never be added to one.
#
# `/start` DOES add `modes.rigor` and `modes.automation` here — that is its job,
# and a `modes:` block containing those two is the expected state of a configured
# project, not a mistake.
#
# What must stay absent is the six knobs `modes.rigor` FRONTS:
# `modes.review_mode`, `modes.workflow`, `docs.density`, `qa.level`,
# `modes.story_granularity` and `team.size`. Seeding any of them in this file
# pins that value and shadows the rigor expansion, so `/start` asking "what are
# you building?" would stop changing anything. `/start` Phase 3c documents the
# same rule for the file it writes.
#
# Per-developer preferences belong in `project.local.yaml` (gitignored), not
# here. `/settings --local <key>=<value>` writes there; `/settings <key>=<value>`
# edits this file. See `.claude/docs/config-resolution.md` for the full
# precedence order.

# Written by /setup-engine (Unreal Engine 5.8.3, HARVEST PANIC). The Unreal
# project lives in a subfolder: HarvestPanic/HarvestPanic.uproject.
engine:
  name: "Unreal"
  version: "5.8.3"
  language: "C++"
  rendering: "Lumen + Nanite (deferred)"
  physics: "Chaos"
  path: "/Applications/UE_5.8"

specialists:
  code: "unreal-specialist"
  shader: "unreal-specialist"
  ui: "ue-umg-specialist"
  additional: ["ue-gas-specialist", "ue-blueprint-specialist", "ue-replication-specialist"]

naming:
  classes: PascalCase
  variables: PascalCase
  constants: SCREAMING_SNAKE   # UNVERIFIED — not sourceable from
                               # docs/engine-reference/unreal/; confirm before relying on it
  signals: On<Event>
  files: PascalCase
  scenes: PascalCase

commands:
  # TODO: confirm these once HarvestPanic/HarvestPanic.uproject exists — adjust via /settings
  build: '"/Applications/UE_5.8/Engine/Build/BatchFiles/RunUAT.sh" BuildCookRun -project="$(pwd)/HarvestPanic/HarvestPanic.uproject" -platform=Mac -build -cook'
  test: '"/Applications/UE_5.8/Engine/Binaries/Mac/UnrealEditor-Cmd" "$(pwd)/HarvestPanic/HarvestPanic.uproject" -ExecCmds="Automation RunTests HarvestPanic.; Quit" -unattended -nullrhi -stdout -FullStdOutLogOutput'
  run: '"/Applications/UE_5.8/Engine/Binaries/Mac/UnrealEditor.app/Contents/MacOS/UnrealEditor" "$(pwd)/HarvestPanic/HarvestPanic.uproject" -game -windowed -ResX=1280 -ResY=720'
  smoke: '"/Applications/UE_5.8/Engine/Binaries/Mac/UnrealEditor-Cmd" "$(pwd)/HarvestPanic/HarvestPanic.uproject" -game -nullrhi -unattended -stdout -ExecCmds="Quit"'
